<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>

  <!-- Screen Window -->
  <rect x="80" y="80" width="352" height="110" rx="24" fill="#121620" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
  <rect x="290" y="118" width="115" height="34" rx="8" fill="url(#accentGrad)" opacity="0.9"/>

  <!-- Calculator Grid Buttons -->
  <!-- Row 1 -->
  <rect x="80" y="220" width="70" height="60" rx="16" fill="#1f2637"/>
  <rect x="174" y="220" width="70" height="60" rx="16" fill="#1f2637"/>
  <rect x="268" y="220" width="70" height="60" rx="16" fill="#1f2637"/>
  <rect x="362" y="220" width="70" height="60" rx="16" fill="url(#amberGrad)"/>

  <!-- Row 2 -->
  <rect x="80" y="300" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="174" y="300" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="268" y="300" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="362" y="300" width="70" height="60" rx="16" fill="url(#amberGrad)"/>

  <!-- Row 3 -->
  <rect x="80" y="380" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="174" y="380" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="268" y="380" width="70" height="60" rx="16" fill="#171c28"/>
  <rect x="362" y="380" width="70" height="60" rx="16" fill="url(#accentGrad)"/>
</svg>
